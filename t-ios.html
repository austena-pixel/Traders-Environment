  transition:

.sidebar-collapse-toggle:hover,

  position:absolute;

  transform:translateX(-2px);

.sidebar-reopen-toggle{

function initAuthIntelligenceAnimation(){
  const canvas = document.getElementById('intelligenceCanvas');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  const reducedMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let width = 0, height = 0, dpr = 1, raf = null;
  const nodes = [];
  const streams = [];
  const NODE_COUNT = 34;
  const STREAM_COUNT = 10;

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    width = canvas.clientWidth || window.innerWidth;
    height = canvas.clientHeight || window.innerHeight;
    canvas.width = Math.floor(width * dpr);
    canvas.height = Math.floor(height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if(!nodes.length){
      for(let i=0;i<NODE_COUNT;i++){
        nodes.push({
          x:Math.random()*width,
          y:Math.random()*height,
          vx:(Math.random()-.5)*0.28,
          vy:(Math.random()-.5)*0.28,
          r:1.8 + Math.random()*2.7,
          pulse:Math.random()*Math.PI*2
        });
      }
      for(let i=0;i<STREAM_COUNT;i++){
        streams.push({
          y:height*(0.12 + 0.76*Math.random()),
          x:Math.random()*width,
          speed:0.55 + Math.random()*1.1,
          len:100 + Math.random()*180,
          alpha:0.08 + Math.random()*0.12
        });
      }
    } else {
      nodes.forEach(n=>{
        n.x = Math.min(width, Math.max(0, n.x/Math.max(1, width)*width || Math.random()*width));
        n.y = Math.min(height, Math.max(0, n.y/Math.max(1, height)*height || Math.random()*height));
      });
    }
  }

  function drawBackdrop(time){
    const t = time * 0.001;
    const centerX = width * 0.5;
    const centerY = height * 0.5;

    const halo = ctx.createRadialGradient(centerX, centerY, 0, centerX, centerY, Math.max(width,height)*0.38);
    halo.addColorStop(0, 'rgba(46,121,255,0.06)');
    halo.addColorStop(0.48, 'rgba(25,45,92,0.04)');
    halo.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = halo;
    ctx.fillRect(0,0,width,height);

    ctx.save();
    ctx.translate(centerX, centerY);
    ctx.strokeStyle = 'rgba(103,166,255,.09)';
    ctx.lineWidth = 1;
    for(let r=120;r<Math.min(width,height)*0.42;r+=70){
      ctx.beginPath();
      ctx.arc(0,0,r, t*0.09, t*0.09 + Math.PI*1.3);
      ctx.stroke();
    }
    ctx.restore();

    streams.forEach((s,i)=>{
      s.x += s.speed;
      if(s.x - s.len > width) s.x = -40;
      if(i % 3 === 0){
        s.y += Math.sin(t*0.8 + i) * 0.04;
      }
      const g = ctx.createLinearGradient(s.x - s.len, s.y, s.x, s.y);
      g.addColorStop(0, 'rgba(0,0,0,0)');
      g.addColorStop(0.45, `rgba(64,170,255,${s.alpha})`);
      g.addColorStop(1, 'rgba(117,106,255,0)');
      ctx.strokeStyle = g;
      ctx.lineWidth = 1.2;
      ctx.beginPath();
      ctx.moveTo(s.x - s.len, s.y);
      ctx.lineTo(s.x, s.y);
      ctx.stroke();
    });
  }

  function draw(time){
    ctx.clearRect(0,0,width,height);
    drawBackdrop(time);
    const t = time * 0.001;
    const linkDist = Math.min(width, height) * 0.17;

    for(const n of nodes){
      n.x += reducedMotion ? 0 : n.vx;
      n.y += reducedMotion ? 0 : n.vy;
      if(n.x < -20) n.x = width + 20;
      if(n.x > width + 20) n.x = -20;
      if(n.y < -20) n.y = height + 20;
      if(n.y > height + 20) n.y = -20;
    }

    for(let i=0;i<nodes.length;i++){
      for(let j=i+1;j<nodes.length;j++){
        const a = nodes[i], b = nodes[j];
        const dx = a.x - b.x;
        const dy = a.y - b.y;
        const dist = Math.hypot(dx,dy);
        if(dist < linkDist){
          const alpha = (1 - dist/linkDist) * 0.22;
          ctx.strokeStyle = `rgba(104,167,255,${alpha})`;
          ctx.lineWidth = dist < linkDist*0.45 ? 1.05 : .75;
          ctx.beginPath();
          ctx.moveTo(a.x, a.y);
          ctx.lineTo(b.x, b.y);
          ctx.stroke();
        }
      }
    }

    nodes.forEach((n,index)=>{
      const pulse = 0.55 + 0.45*Math.sin(t*1.8 + n.pulse + index*0.17);
      ctx.beginPath();
      ctx.fillStyle = `rgba(137,224,255,${0.32 + pulse*0.2})`;
      ctx.arc(n.x, n.y, n.r + pulse*1.3, 0, Math.PI*2);
      ctx.fill();
      ctx.beginPath();
      ctx.fillStyle = `rgba(111,170,255,${0.78})`;
      ctx.arc(n.x, n.y, n.r*0.55, 0, Math.PI*2);
      ctx.fill();
    });

    if(!reducedMotion) raf = requestAnimationFrame(draw);
  }

  resize();
  draw(0);
  if(!reducedMotion) raf = requestAnimationFrame(draw);
  window.addEventListener('resize', resize);
  document.addEventListener('visibilitychange', ()=>{
    if(document.hidden){
      if(raf) cancelAnimationFrame(raf);
      raf = null;
    } else if(!reducedMotion && !raf){
      raf = requestAnimationFrame(draw);
    }
  });
}

    const executionChecksForTrade=executionReviewRows.filter(row=>executionItemTypeFromKey(row.criterion_key)==='check').slice(0,2).map(row=>({criterion:shortContextText(row.criterion_label||row.criterion_key,70)||'Recorded execution check',complied:Boolean(row.complied),comment:shortContextText(row.comment,100)}));
    const executionNotes=executionReviewRows.filter(row=>executionItemTypeFromKey(row.criterion_key)!=='check'&&!String(row.criterion_key||'').startsWith('text__ti_state__')&&String(row.comment||'').trim()).map(row=>(shortContextText(row.criterion_label,70)||'Reflection')+': '+row.comment);
    const legacyNotes=executionReview?[executionReview.what_went_well,executionReview.execution_errors,executionReview.next_adjustment,executionReview.notes].filter(value=>String(value||'').trim()):[];
    const executionNote=shortContextText([...legacyNotes,...executionNotes].join(' · '),160);
    return {
      reference:tradeReference.get(trade.id),date:String(trade.trade_date||'').slice(0,10),
      instrument:shortContextText(trade.instrument,40),direction:shortContextText(trade.direction,16),setup:shortContextText(trade.setup,80),
      journalNote:shortContextText(trade.notes,160),setupEvidence,
      playbookVersion:assignedPlaybookSnapshot&&assignedPlaybookName?{name:assignedPlaybookName,version:Number(assignedPlaybookSnapshot.version)}:null,
      pnl:trade.pnl!==null&&trade.pnl!==undefined&&String(trade.pnl).trim()!==''&&Number.isFinite(Number(trade.pnl))?Number(trade.pnl):null,
      playbook:edgeReview?{reviewed:true,scorePct:edgeScoreForTrade(trade.id),rating:shortContextText(edgeRatingForTrade(trade.id),24),note:shortContextText(edgeReview.review_notes,160),marketState:shortContextText(edgeReview.market_state,80),entryPattern:shortContextText(edgeReview.entry_pattern,100),exitRule:shortContextText(edgeReview.exit_rule,100),checks:edgeChecks}:null,
      execution:executionReview?{reviewed:true,scorePct:executionScoreForTrade(trade.id),rating:executionRatingForTrade(trade.id),note:executionNote,marketState:null,entryPattern:null,exitRule:null,checks:executionChecksForTrade}:null
    };
  });
  const psychSessionsForPeriod=tiosConversationReady&&range
    ? psychologySessions.filter(session=>String(session.session_date||'')>=localDateString(range.start)&&String(session.session_date||'')<=localDateString(range.end)&&(!session.account_id||session.account_id===tradingAccount?.id))
      .slice().sort((a,b)=>String(b.session_date||'').localeCompare(String(a.session_date||''))||String(b.updated_at||b.created_at||'').localeCompare(String(a.updated_at||a.created_at||'')))
    : [];
  const psychEvidenceSessions=psychSessionsForPeriod.slice(0,3).map((session,index)=>({
    reference:'D'+String(index+1).padStart(2,'0'),date:String(session.session_date||'').slice(0,10),label:shortContextText(session.session_label,60),
    affirmationBefore:Boolean(session.affirmation_before),affirmationAfter:Boolean(session.affirmation_after),
    signal:shortContextText(session.signal,80),noise:shortContextText(session.noise,80),strengths:shortContextText(session.strengths,80),
    weaknesses:shortContextText(session.weaknesses,80),opportunities:shortContextText(session.opportunities,80),threats:shortContextText(session.threats,80),
    adjustments:shortContextText(session.adjustments,120),comments:shortContextText(session.comments,120),
    identityScores:sessionIdentityRows(session.id).slice(0,8).map(row=>({topic:shortContextText(row.value_key,40)||'identity',score:Number.isFinite(Number(row.score))?Number(row.score):null})),
    ruleChecks:sessionRuleRows(session.id).slice(0,6).map(row=>({ruleNumber:Number(row.rule_number),complied:Boolean(row.complied),comment:shortContextText(row.comment,100)}))
  }));
  const edgeEvidence={
    reviewedTrades:edgeReviewsForPeriod.length,scoredTrades:edgePerTrade.length,totalChecks:edgeUnits.length,compliedChecks:edgePassed,missedChecks:edgeUnits.length-edgePassed,
    adherencePct:edgeUnits.length?roundEvidence(edgePassed/edgeUnits.length*100,1):null,
    averageScorePct:edgePerTrade.length?roundEvidence(averageFinite(edgePerTrade.map(item=>item.score)),1):null,
    references:edgeReviewsForPeriod.filter(item=>selectedEvidence.some(trade=>trade.reference===tradeReference.get(item.trade.id))).map(item=>tradeReference.get(item.trade.id)).filter(Boolean).slice(0,20)
  };
  const executionEvidence={
    reviewedTrades:executionReviewsForPeriod.length,scoredTrades:executionPerTrade.length,totalChecks:executionRows.length,compliedChecks:executionPassed,missedChecks:executionRows.length-executionPassed,
    adherencePct:executionRows.length?roundEvidence(executionPassed/executionRows.length*100,1):null,
    averageScorePct:executionPerTrade.length?roundEvidence(averageFinite(executionPerTrade.map(item=>item.score)),1):null,
    references:executionReviewsForPeriod.filter(review=>selectedEvidence.some(trade=>trade.reference===tradeReference.get(review.trade_id))).map(review=>tradeReference.get(review.trade_id)).filter(Boolean).slice(0,20)
  };
  return {
    ready:tiosConversationReady,
    userId:currentUser?.id||null,
    accountId:tradingAccount?.id||null,
    accountName:tradingAccount?accountDisplayName(tradingAccount):'Selected account',
    currency:String(tradingAccount?.currency||'USD').toUpperCase(),
    initialBalance:initialAccountBalance(),
    equity:accountHasFreshMt5Snapshot(tradingAccount)&&tradingAccount?.current_equity!=null&&Number.isFinite(Number(tradingAccount.current_equity))?Number(tradingAccount.current_equity):null,
    today:localDateString(today),weekStart:localDateString(monday),
    month:localDateString(viewDate).slice(0,7),
    monthLabel:viewDate.toLocaleDateString(undefined,{month:'long',year:'numeric'}),
    trades:selectedTrades.map(t=>({date:String(t.trade_date||'').slice(0,10),pnl:t.pnl!==null&&t.pnl!==undefined&&String(t.pnl).trim()!==''&&Number.isFinite(Number(t.pnl))?Number(t.pnl):null})),
    evidence:{
      periodStart:range?localDateString(range.start):'',periodEnd:range?localDateString(range.end):'',
      totalTrades:selectedTrades.length,includedTrades:selectedEvidence.length,omittedTrades:Math.max(0,selectedTrades.length-selectedEvidence.length),
      trades:selectedEvidence,edge:edgeEvidence,execution:executionEvidence,
      psychology:{totalSessions:psychSessionsForPeriod.length,includedSessions:psychEvidenceSessions.length,omittedSessions:Math.max(0,psychSessionsForPeriod.length-psychEvidenceSessions.length),sessions:psychEvidenceSessions}
    },
    execution:{
      reviewed:model?.sample.reviewedTrades||0,checks:model?.sample.totalChecks||0,
      adherence:model?.execution.adherencePct??null,averageScore:model?.execution.averageScorePct??null,
      weakest:(model?.currentWeakestCriteria||[]).map(item=>({label:item.label,misses:item.misses,checks:item.checks}))
    }
  };
};
