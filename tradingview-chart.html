<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>TradingView chart · T-IOS</title>
  <style>
    html,body{width:100%;height:100%;margin:0;background:#131722;color:#a9b3c5;font:12px Arial,sans-serif;overflow:hidden}
    .tradingview-widget-container{height:100%;width:100%}
    .tradingview-widget-container__widget{height:calc(100% - 32px);width:100%}
    .tradingview-widget-copyright{height:32px;display:flex;align-items:center;justify-content:center;gap:4px}
    a{color:#69a8ff;text-decoration:none}
  </style>
  <script src="core/chart-workspace.js"></script>
</head>
<body>
  <!-- This dedicated document owns the official embed and its listeners. Removing
       the host iframe disposes the entire widget without a private TradingView API. -->
  <div class="tradingview-widget-container">
    <div class="tradingview-widget-container__widget"></div>
    <div class="tradingview-widget-copyright"><a target="_blank" rel="noopener nofollow"><span class="blue-text"></span></a><span class="trademark">by TradingView</span></div>
  </div>
  <script>
    (function(){
      'use strict';
      let payload;
      const container=document.querySelector('.tradingview-widget-container');
      try{
        payload=JSON.parse(decodeURIComponent(location.hash.slice(1)));
        const prefs=TIOSChartPreferences.defaults();
        prefs.charts.single=[payload.chart];prefs.theme=payload.theme;prefs.timezone=payload.timezone;
        if(TIOSChartPreferences.validate(prefs)||typeof payload.instance!=='string'||!/^[a-z0-9-]{1,80}$/.test(payload.instance))throw Error('Invalid chart configuration');
      }catch{
        container.textContent='This chart configuration is unavailable.';return;
      }
      const report=state=>parent.postMessage({type:'tios:chart-widget-state',instance:payload.instance,state},location.origin);
      const link=container.querySelector('a');
      link.href='https://www.tradingview.com/chart/?symbol='+encodeURIComponent(payload.chart.symbol);
      link.querySelector('span').textContent=payload.chart.symbol+' chart';
      document.title=payload.chart.symbol+' · TradingView chart';
      if(payload.theme==='light'){document.body.style.background='#fff';document.body.style.color='#666'}
      let observed=false;
      const timeout=setTimeout(()=>report('slow'),30000);
      const observer=new MutationObserver(()=>{
        const frame=container.querySelector('iframe');
        if(!frame||observed)return;
        observed=true;observer.disconnect();
        frame.addEventListener('load',()=>{clearTimeout(timeout);report('loaded')},{once:true});
        frame.addEventListener('error',()=>{clearTimeout(timeout);report('error')},{once:true});
      });
      observer.observe(container,{childList:true,subtree:true});
      const script=document.createElement('script');
      script.src='https://s3.tradingview.com/external-embedding/embed-widget-advanced-chart.js';
      script.type='text/javascript';script.async=true;
      script.textContent=JSON.stringify(TIOSChartPreferences.widgetSettings(payload.chart,payload));
      script.addEventListener('error',()=>{clearTimeout(timeout);observer.disconnect();report('error')},{once:true});
      container.appendChild(script);
    })();
  </script>
</body>
</html>
